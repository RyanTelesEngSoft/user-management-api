services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_management_api
    ports:
        - "3307:3306"
    volumes:
        - mysql_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5

  api:
    build: .
    container_name: user-management-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/user_management_api
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_KEY: ${JWT_KEY}
    depends_on:
      mysql:
        condition: service_healthy


volumes:
       mysql_data:

